apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
    app.kubernetes.io/part-of: agent-relay
spec:
  selector:
    app.kubernetes.io/name: agent-relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
    app.kubernetes.io/part-of: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-relay
        app.kubernetes.io/part-of: agent-relay
    spec:
      initContainers:
        # The app creates its schema at startup; wait for PostgreSQL instead
        # of crash-looping until it accepts connections.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: api
          image: agent-relay:local
          # Loaded with `kind load docker-image`; never pull from a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
